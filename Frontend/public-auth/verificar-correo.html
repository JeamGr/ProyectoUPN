<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verifica tu correo — YANANTIN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card" style="max-width: 480px;">
    <div class="p-4 p-md-5 text-center">
      <div class="brand-logo fs-4 mb-4">YANANTIN</div>

      <div class="fs-1 mb-3">📧</div>
      <h2 class="fw-bold mb-2">¡Verifica tu correo!</h2>
      <p class="text-muted mb-4">
        Te enviamos un código de 6 dígitos a <strong id="correoTexto">tu correo</strong>.
        Revisa tu bandeja de entrada y spam.
      </p>

      <div id="alertaError" class="alert alert-danger alert-form text-start" role="alert"></div>
      <div id="alertaExito" class="alert alert-success alert-form text-start" role="alert"></div>

      <form id="formVerificar" novalidate>
        <input
          type="text"
          class="form-control form-control-lg text-center mb-3"
          id="codigo"
          maxlength="6"
          placeholder="000000"
          style="letter-spacing: 0.5em; font-weight: 700;"
          required
        >
        <button type="submit" class="btn btn-brand-primary w-100 mb-3" id="btnVerificar">
          <span id="btnTexto">Verificar código</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm ms-1 d-none"></span>
        </button>
      </form>

      <button type="button" class="btn btn-link link-brand" id="btnReenviar">Reenviar código</button>
    </div>
  </div>
</div>

<script>
const API_BASE_URL = 'http://localhost:3003';

const params = new URLSearchParams(window.location.search);
const usuarioId = Number(params.get('usuarioId'));
const tipo = params.get('tipo'); // 'voluntario' | 'organizacion' | null

const LOGIN_POR_TIPO = {
    voluntario: 'login-voluntario.html',
    organizacion: 'login-organizacion.html',
};
const loginDestino = LOGIN_POR_TIPO[tipo] || 'login.html';

if (!usuarioId) {
    document.body.innerHTML = '<div class="p-5 text-center text-danger">Falta el identificador de usuario. Vuelve a intentar el registro o el login.</div>';
}

const form = document.getElementById('formVerificar');
const alertaError = document.getElementById('alertaError');
const alertaExito = document.getElementById('alertaExito');
const btn = document.getElementById('btnVerificar');
const btnTexto = document.getElementById('btnTexto');
const btnSpinner = document.getElementById('btnSpinner');

function ocultarAlertas() {
    alertaError.style.display = 'none';
    alertaExito.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    ocultarAlertas();
    btn.disabled = true;
    btnTexto.textContent = 'Verificando...';
    btnSpinner.classList.remove('d-none');

    try {
        const respuesta = await fetch(`${API_BASE_URL}/auth/verificar-codigo`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuarioId, codigo: document.getElementById('codigo').value }),
        });
        const datos = await respuesta.json();

        if (!datos.ok) {
            alertaError.textContent = datos.mensaje;
            alertaError.style.display = 'block';
            return;
        }

        alertaExito.textContent = datos.mensaje;
        alertaExito.style.display = 'block';
        setTimeout(() => { window.location.href = loginDestino; }, 1500);
    } catch (error) {
        alertaError.textContent = 'No se pudo conectar con el servidor.';
        alertaError.style.display = 'block';
    } finally {
        btn.disabled = false;
        btnTexto.textContent = 'Verificar código';
        btnSpinner.classList.add('d-none');
    }
});

document.getElementById('btnReenviar').addEventListener('click', async () => {
    ocultarAlertas();
    try {
        const respuesta = await fetch(`${API_BASE_URL}/auth/reenviar-codigo`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuarioId }),
        });
        const datos = await respuesta.json();
        alertaExito.textContent = datos.mensaje;
        alertaExito.style.display = 'block';
    } catch (error) {
        alertaError.textContent = 'No se pudo reenviar el código.';
        alertaError.style.display = 'block';
    }
});
</script>
</body>
</html>
