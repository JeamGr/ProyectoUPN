<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YANANTIN - ¡Inscripción Exitosa!</title>

  <!-- Bootstrap 5 CSS e Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- CSS Exclusivo de Éxito -->
  <link rel="stylesheet" href="./exito.css">
</head>
<body>

  <!-- Topbar Simplificado -->
  <header class="bg-white py-3 border-bottom">
    <div class="container text-center">
      <div class="brand-logo">
        <i class="bi bi-heart-pulse-fill text-danger"></i> YANANTIN
      </div>
    </div>
  </header>

  <!-- Contenido Central -->
  <main class="container my-auto py-5">
    <div class="card card-success p-4 p-md-5 text-center">

      <!-- Icono de Check Verde -->
      <div class="success-icon-wrapper">
        <i class="bi bi-check-lg"></i>
      </div>

      <!-- Textos Principales -->
      <h2 class="fw-bold mb-2">¡Te has inscrito con éxito!</h2>
      <p class="text-muted small mb-4">Ya formas parte de esta iniciativa social.</p>

      <!-- Detalle del Evento -->
      <div class="event-info-box text-start mb-4">
        <span class="badge bg-white text-dark border mb-1" style="font-size: 0.75rem;">Oportunidad</span>
        <h6 id="txtTitulo" class="fw-bold mb-1" style="color: #6D28D9;">Cargando oportunidad...</h6>
        <p class="text-muted small mb-0">
          <i class="bi bi-building"></i> <span id="txtOrganizacion">Organización</span> • <span id="txtFecha">Por confirmar</span>
        </p>
      </div>

      <p class="text-muted small mb-4">
        Te hemos enviado los detalles, indicaciones y punto de encuentro a tu correo institucional.
      </p>

      <!-- Botones de Navegación -->
      <div class="d-grid gap-3">
        <a href="../mis-eventos/mis-eventos.html" class="btn btn-yanantin">
          Ver mis eventos <i class="bi bi-arrow-right ms-1"></i>
        </a>
        <a href="../explorar/explorar.html" class="link-explore small">
          Explorar más oportunidades
        </a>
      </div>

    </div>
  </main>

  <!-- SCRIPT DE CONEXIÓN CON LA API -->
  <script>
    const API_BASE_URL = 'http://localhost:3003';
    const token = localStorage.getItem('token');

    // Guard de autenticación
    if (!token) window.location.href = '../public-auth/login-voluntario.html';
    const headers = { Authorization: `Bearer ${token}` };

    // Extraer el ID desde la URL (?id=...)
    const urlParams = new URLSearchParams(window.location.search);
    const oportunidadId = urlParams.get('id');

    async function cargarDetalleInscripcion() {
      if (!oportunidadId) return;

      try {
        const resp = await fetch(`${API_BASE_URL}/oportunidades/${oportunidadId}`, { headers });
        const datos = await resp.json();

        if (!datos) return;
        const op = datos.oportunidad || datos.data || datos;

        document.getElementById('txtTitulo').textContent = op.titulo || 'Oportunidad de Voluntariado';
        document.getElementById('txtOrganizacion').textContent = op.nombreOrganizacion || 'Organización';
        document.getElementById('txtFecha').textContent = op.fechaInicio
          ? new Date(op.fechaInicio).toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' })
          : 'Por confirmar';

      } catch (error) {
        console.error('Error al obtener la información:', error);
      }
    }

    cargarDetalleInscripcion();
  </script>

</body>
</html>
