<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YANANTIN - Mis Eventos</title>

  <!-- Bootstrap 5 CSS e Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- CSS Exclusivo de Mis Eventos -->
  <link rel="stylesheet" href="./mis-eventos.css">
</head>
<body>

  <div class="dashboard-container">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand-logo d-flex align-items-center gap-2">
        <i class="bi bi-heart-pulse-fill text-danger"></i> YANANTIN
      </div>

      <nav class="flex-grow-1">
        <a href="../dashboard-voluntario/dashboard-voluntario.html" class="nav-link-custom">
          <i class="bi bi-house-door"></i> Inicio
        </a>
        <a href="../explorar/explorar.html" class="nav-link-custom">
          <i class="bi bi-compass"></i> Explorar
        </a>
        <a href="#" class="nav-link-custom active">
          <i class="bi bi-calendar-event-fill"></i> Mis eventos
        </a>
        <a href="../perfil/perfil.html" class="nav-link-custom">
          <i class="bi bi-person"></i> Mi perfil
        </a>
        <a href="#" class="nav-link-custom">
          <i class="bi bi-gear"></i> Configuración
        </a>
      </nav>

      <div class="border-top pt-3">
        <a href="#" id="btnCerrarSesion" class="nav-link-custom text-danger">
          <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Header de Sección -->
      <div class="mb-4">
        <h3 class="fw-bold mb-1">Mis Eventos</h3>
        <p class="text-muted small">Administra tus voluntariados activos y revisa tu historial de participación.</p>
      </div>

      <!-- Pestañas (Tabs de Navegación) -->
      <ul class="nav nav-tabs nav-tabs-custom mb-4" id="eventosTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="proximos-tab" data-bs-toggle="tab" data-bs-target="#proximos" type="button" role="tab">
            Próximos <span id="cntProximos" class="badge bg-light text-dark ms-1">0</span>
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="en-curso-tab" data-bs-toggle="tab" data-bs-target="#en-curso" type="button" role="tab">
            En curso <span id="cntEnCurso" class="badge bg-light text-dark ms-1">0</span>
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="completados-tab" data-bs-toggle="tab" data-bs-target="#completados" type="button" role="tab">
            Completados <span id="cntCompletados" class="badge bg-light text-dark ms-1">0</span>
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="cancelados-tab" data-bs-toggle="tab" data-bs-target="#cancelados" type="button" role="tab">
            Cancelados <span id="cntCancelados" class="badge bg-light text-dark ms-1">0</span>
          </button>
        </li>
      </ul>

      <!-- Contenido de las Pestañas -->
      <div class="tab-content" id="eventosTabsContent">

        <!-- Tab 1: Próximos -->
        <div class="tab-pane fade show active" id="proximos" role="tabpanel">
          <div id="contenedorProximos" class="d-flex flex-column gap-3">
            <!-- Carga dinámica -->
          </div>
        </div>

        <!-- Tab 2: En curso -->
        <div class="tab-pane fade" id="en-curso" role="tabpanel">
          <div id="contenedorEnCurso" class="d-flex flex-column gap-3">
            <!-- Carga dinámica -->
          </div>
        </div>

        <!-- Tab 3: Completados -->
        <div class="tab-pane fade" id="completados" role="tabpanel">
          <div id="contenedorCompletados" class="d-flex flex-column gap-3">
            <!-- Carga dinámica -->
          </div>
        </div>

        <!-- Tab 4: Cancelados -->
        <div class="tab-pane fade" id="cancelados" role="tabpanel">
          <div id="contenedorCancelados" class="d-flex flex-column gap-3">
            <!-- Carga dinámica -->
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- JS de Bootstrap para funcionamiento de las Pestañas -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SCRIPT DE CONEXIÓN A LA API REST (TYPEORM / EXPRESS) -->
  <script>
    const API_BASE_URL = 'http://localhost:3003';
    const token = localStorage.getItem('token');

    // 🔒 Guard de Autenticación
    if (!token) {
      window.location.href = '../public-auth/login-voluntario.html';
    }

    const headers = { Authorization: `Bearer ${token}` };

    // Función auxiliar para parsear fechas de MySQL ("2026-05-24" -> Dia: 24, Mes: MAY)
    function obtenerFechaFormateada(fechaStr) {
      if (!fechaStr) return { dia: '24', mes: 'MAY' };
      const fecha = new Date(fechaStr);
      if (isNaN(fecha.getTime())) return { dia: '24', mes: 'MAY' };

      const meses = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
      return {
        dia: fecha.getDate().toString().padStart(2, '0'),
        mes: meses[fecha.getMonth()]
      };
    }

    // Función para renderizar tarjeta de evento
    function crearTarjetaEvento(item, sePuedeCancelar = false) {
      const div = document.createElement('div');
      div.className = 'event-item-card d-flex align-items-center justify-content-between';

      const op = item.oportunidad || item;
      const esPresencial = (op.modalidad || '').toLowerCase() === 'presencial';
      const badgeClass = esPresencial ? 'badge-presencial' : 'badge-virtual';
      
      const fechaObj = obtenerFechaFormateada(op.fecha_inicio || op.fecha);
      const titulo = op.titulo || 'Voluntariado';
      const organizacion = op.organizacionNombre || op.organizacion_nombre || op.organizacion?.nombre || 'Organización';
      const horario = op.horario || '8:00 AM - 12:00 PM';
      const ubicacion = op.ubicacion || (esPresencial ? 'Lima' : 'En línea');

      // Generación del HTML de la tarjeta
      div.innerHTML = `
        <div class="d-flex align-items-center gap-3">
          <div class="event-date-box">
            <span class="day">${fechaObj.dia}</span>
            <span class="month">${fechaObj.mes}</span>
          </div>
          <div>
            <h6 class="fw-bold mb-1">${titulo}</h6>
            <p class="text-muted small mb-1"><i class="bi bi-building me-1"></i> ${organizacion}</p>
            <small class="text-muted"><i class="bi bi-clock me-1"></i> ${horario} • ${ubicacion}</small>
          </div>
        </div>
        <div class="d-flex align-items-center gap-3">
          <span class="badge ${badgeClass} rounded-pill px-3 py-2">${esPresencial ? 'Presencial' : 'Virtual'}</span>
          
          ${sePuedeCancelar ? `
            <div class="dropdown">
              <button class="btn btn-outline-secondary btn-sm rounded-circle" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-three-dots-vertical"></i>
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-menu-item text-danger small p-2 text-decoration-none d-block cursor-pointer" onclick="cancelarInscripcion(${item.id})"><i class="bi bi-x-circle me-1"></i> Cancelar inscripción</a></li>
              </ul>
            </div>
          ` : ''}
        </div>
      `;

      return div;
    }

    // Función principal para obtener inscripciones
    async function cargarMisEventos() {
      try {
        // Petición a la API
        const resp = await fetch(`${API_BASE_URL}/inscripciones/mis-eventos`, { headers });

        const resData = await resp.json();
        const lista = Array.isArray(resData) ? resData : (resData.data || []);

        // Contenedores
        const contProximos = document.getElementById('contenedorProximos');
        const contEnCurso = document.getElementById('contenedorEnCurso');
        const contCompletados = document.getElementById('contenedorCompletados');
        const contCancelados = document.getElementById('contenedorCancelados');

        contProximos.innerHTML = '';
        contEnCurso.innerHTML = '';
        contCompletados.innerHTML = '';
        contCancelados.innerHTML = '';

        // Clasificación con los 6 estados reales del enum
        // ('inscrito','confirmado','completado','no_asistio','cancelado','rechazado')
        // y "en curso" calculado por fecha, ya que no existe ese estado en la BD.
        const hoy = new Date();

        function estaEnCurso(op) {
          if (!op.fecha) return false;
          const inicio = new Date(op.fecha);
          const fin = op.fechaFin ? new Date(op.fechaFin) : inicio;
          return hoy >= inicio && hoy <= fin;
        }

        const listProximos = lista.filter(i => {
          const e = (i.estado || '').toLowerCase();
          const op = i.oportunidad || i;
          return (e === 'inscrito' || e === 'confirmado') && !estaEnCurso(op);
        });

        const listEnCurso = lista.filter(i => {
          const e = (i.estado || '').toLowerCase();
          const op = i.oportunidad || i;
          return e === 'confirmado' && estaEnCurso(op);
        });

        const listCompletados = lista.filter(i => {
          const e = (i.estado || '').toLowerCase();
          return e === 'completado' || e === 'no_asistio';
        });

        const listCancelados = lista.filter(i => {
          const e = (i.estado || '').toLowerCase();
          return e === 'cancelado' || e === 'rechazado';
        });

        // Actualizar badges
        document.getElementById('cntProximos').textContent = listProximos.length;
        document.getElementById('cntEnCurso').textContent = listEnCurso.length;
        document.getElementById('cntCompletados').textContent = listCompletados.length;
        document.getElementById('cntCancelados').textContent = listCancelados.length;

        // Render Próximos
        if (listProximos.length === 0) {
          contProximos.innerHTML = '<p class="text-muted py-4 text-center">No tienes voluntariados próximos programados.</p>';
        } else {
          listProximos.forEach(item => contProximos.appendChild(crearTarjetaEvento(item, true)));
        }

        // Render En Curso
        if (listEnCurso.length === 0) {
          contEnCurso.innerHTML = '<p class="text-muted py-4 text-center">No tienes actividades en curso actualmente.</p>';
        } else {
          listEnCurso.forEach(item => contEnCurso.appendChild(crearTarjetaEvento(item, false)));
        }

        // Render Completados
        if (listCompletados.length === 0) {
          contCompletados.innerHTML = '<div class="text-center py-5"><i class="bi bi-check-circle fs-1 text-muted"></i><p class="text-muted mt-2">No tienes eventos marcados como completados aún.</p></div>';
        } else {
          listCompletados.forEach(item => contCompletados.appendChild(crearTarjetaEvento(item, false)));
        }

        // Render Cancelados
        if (listCancelados.length === 0) {
          contCancelados.innerHTML = '<p class="text-muted py-4 text-center">No has cancelado ninguna participación.</p>';
        } else {
          listCancelados.forEach(item => contCancelados.appendChild(crearTarjetaEvento(item, false)));
        }

      } catch (error) {
        console.error('Error al cargar mis eventos:', error);
      }
    }

    // RF-027: Cancelar inscripción
    async function cancelarInscripcion(inscripcionId) {
      if (!confirm('¿Estás seguro de que deseas cancelar tu participación en este evento?')) return;

      try {
        const resp = await fetch(`${API_BASE_URL}/inscripciones/${inscripcionId}`, {
          method: 'DELETE',
          headers
        });

        if (resp.ok) {
          alert('Inscripción cancelada exitosamente.');
          cargarMisEventos(); // Recarga la lista dinámicamente
        } else {
          const err = await resp.json();
          alert(err.message || 'No se pudo cancelar la inscripción.');
        }
      } catch (error) {
        console.error('Error al cancelar inscripción:', error);
      }
    }

    // Botón Cerrar Sesión
    document.getElementById('btnCerrarSesion').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('token');
      window.location.href = '../public-auth/login-voluntario.html';
    });

    // Carga inicial
    cargarMisEventos();
  </script>
</body>
</html>
