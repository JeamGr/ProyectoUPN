<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Crear oportunidad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
.paso-indicador { display:flex; gap:0.5rem; margin-bottom:2rem; }
.paso-indicador .paso { flex:1; text-align:center; padding-bottom:0.5rem; border-bottom:3px solid #E3E0EE; color:#6B6580; font-weight:600; font-size:0.85rem; }
.paso-indicador .paso.activo { border-color: var(--color-primary); color: var(--color-primary); }
.paso-indicador .paso.completado { border-color: var(--color-secondary); color: var(--color-secondary); }
</style>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:720px;">
  <a href="mis-oportunidades.html" class="text-muted small">← Cancelar</a>
  <h3 class="fw-bold mt-2 mb-4">Crear oportunidad</h3>

  <div class="paso-indicador">
    <div class="paso activo" data-paso="1">Información</div>
    <div class="paso" data-paso="2">Detalles</div>
    <div class="paso" data-paso="3">Requisitos</div>
    <div class="paso" data-paso="4">Publicar</div>
  </div>

  <div id="alertaError" class="alert alert-danger alert-form"></div>
  <div class="bg-white rounded-3 shadow-sm p-4">

    <!-- PASO 1 -->
    <div class="paso-contenido" data-contenido="1">
      <label class="form-label">Título de la oportunidad</label>
      <input type="text" class="form-control mb-3" id="titulo" placeholder="Ej. Jornada de limpieza de playa">
      <label class="form-label">Descripción</label>
      <textarea class="form-control mb-3" id="descripcion" rows="4" placeholder="Describe los objetivos, actividades y el impacto que se espera lograr..."></textarea>
      <label class="form-label">Línea de intervención</label>
      <select class="form-select mb-3" id="lineaIntervencionId">
        <option value="1">Educación</option>
        <option value="2">Tecnología</option>
        <option value="3">Salud</option>
        <option value="4">Niños</option>
        <option value="5">Adultos mayores</option>
        <option value="6">Medio ambiente</option>
        <option value="7">Inclusión social</option>
        <option value="8">Protección animal</option>
      </select>
    </div>

    <!-- PASO 2 -->
    <div class="paso-contenido d-none" data-contenido="2">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Modalidad</label>
          <select class="form-select" id="modalidad">
            <option value="presencial">Presencial</option>
            <option value="virtual">Virtual</option>
            <option value="mixta">Mixta</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Ubicación</label>
          <input type="text" class="form-control" id="ubicacion" placeholder="Ej. Lurín, Lima">
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Fecha y hora de inicio</label>
          <input type="datetime-local" class="form-control" id="fechaInicio">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Fecha y hora de fin</label>
          <input type="datetime-local" class="form-control" id="fechaFin">
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Horas acreditadas</label>
          <input type="number" min="0" class="form-control" id="horasAcreditadas" value="4">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Cupos totales</label>
          <input type="number" min="1" class="form-control" id="cuposTotales" value="20">
        </div>
      </div>
      <label class="form-label">Imagen de portada</label>
      <input type="file" class="form-control" id="imagen" accept="image/*">
    </div>

    <!-- PASO 3 -->
    <div class="paso-contenido d-none" data-contenido="3">
      <label class="form-label">Requisitos para el voluntario</label>
      <textarea class="form-control mb-3" id="requisitos" rows="5" placeholder="Ej. Ser mayor de 18 años, ropa cómoda, ganas de ayudar..."></textarea>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="requiereAprobacion">
        <label class="form-check-label">Requiere que apruebe manualmente a cada inscrito</label>
      </div>
    </div>

    <!-- PASO 4 -->
    <div class="paso-contenido d-none" data-contenido="4">
      <h5 class="fw-bold mb-3">Revisa antes de publicar</h5>
      <div id="resumen" class="mb-3"></div>
      <p class="text-muted small">Al enviar, tu oportunidad quedará en revisión del equipo administrador antes de ser visible públicamente (si tu organización ya está aprobada).</p>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <button class="btn btn-outline-secondary" id="btnAtras" style="display:none;">Atrás</button>
      <div class="ms-auto">
        <button class="btn btn-outline-secondary me-2" id="btnGuardarBorrador">Guardar como borrador</button>
        <button class="btn btn-brand-primary" id="btnSiguiente">Siguiente</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE_URL = 'http://localhost:3003';
const token = localStorage.getItem('token');
if (!token) window.location.href = '../public-auth/login-organizacion.html';
const headers = { Authorization: `Bearer ${token}` };

let pasoActual = 1;
let oportunidadIdCreada = null;

function mostrarPaso(n) {
    document.querySelectorAll('.paso-contenido').forEach((el) => el.classList.add('d-none'));
    document.querySelector(`.paso-contenido[data-contenido="${n}"]`).classList.remove('d-none');
    document.querySelectorAll('.paso-indicador .paso').forEach((el) => {
        const num = Number(el.dataset.paso);
        el.classList.toggle('activo', num === n);
        el.classList.toggle('completado', num < n);
    });
    document.getElementById('btnAtras').style.display = n > 1 ? 'inline-block' : 'none';
    document.getElementById('btnSiguiente').textContent = n === 4 ? 'Enviar a revisión' : 'Siguiente';

    if (n === 4) {
        document.getElementById('resumen').innerHTML = `
            <p><strong>${document.getElementById('titulo').value}</strong></p>
            <p class="text-muted small">${document.getElementById('descripcion').value}</p>
            <p class="small">${document.getElementById('modalidad').value} · ${document.getElementById('ubicacion').value} · ${document.getElementById('horasAcreditadas').value}h · ${document.getElementById('cuposTotales').value} cupos</p>
        `;
    }
}

function mostrarError(msg) {
    const alerta = document.getElementById('alertaError');
    alerta.textContent = msg;
    alerta.style.display = 'block';
}

async function crearOportunidad(dto) {
    const resp = await fetch(`${API_BASE_URL}/oportunidades`, {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify(dto),
    });
    return resp.json();
}

function armarDTO() {
    return {
        titulo: document.getElementById('titulo').value,
        descripcion: document.getElementById('descripcion').value,
        lineaIntervencionId: Number(document.getElementById('lineaIntervencionId').value),
        modalidad: document.getElementById('modalidad').value,
        ubicacion: document.getElementById('ubicacion').value,
        fechaInicio: document.getElementById('fechaInicio').value,
        fechaFin: document.getElementById('fechaFin').value,
        horasAcreditadas: Number(document.getElementById('horasAcreditadas').value),
        cuposTotales: Number(document.getElementById('cuposTotales').value),
        requisitos: document.getElementById('requisitos').value,
        requiereAprobacion: document.getElementById('requiereAprobacion').checked,
    };
}

async function subirImagenSiHay(id) {
    const archivo = document.getElementById('imagen').files[0];
    if (!archivo) return;
    const formData = new FormData();
    formData.append('imagen', archivo);
    await fetch(`${API_BASE_URL}/oportunidades/${id}/imagen`, { method: 'POST', headers, body: formData });
}

document.getElementById('btnAtras').addEventListener('click', () => { pasoActual--; mostrarPaso(pasoActual); });

document.getElementById('btnGuardarBorrador').addEventListener('click', async () => {
    const datos = await crearOportunidad(armarDTO());
    if (!datos.ok) { mostrarError(datos.mensaje); return; }
    oportunidadIdCreada = datos.oportunidadId;
    await subirImagenSiHay(oportunidadIdCreada);
    window.location.href = 'mis-oportunidades.html';
});

document.getElementById('btnSiguiente').addEventListener('click', async () => {
    document.getElementById('alertaError').style.display = 'none';

    if (pasoActual === 1 && !document.getElementById('titulo').value) {
        mostrarError('El título es obligatorio'); return;
    }
    if (pasoActual === 2 && (!document.getElementById('fechaInicio').value || !document.getElementById('fechaFin').value)) {
        mostrarError('Las fechas son obligatorias'); return;
    }

    if (pasoActual < 4) {
        pasoActual++;
        mostrarPaso(pasoActual);
        return;
    }

    // Paso 4: crear + subir imagen + enviar a revisión
    const datos = await crearOportunidad(armarDTO());
    if (!datos.ok) { mostrarError(datos.mensaje); return; }
    oportunidadIdCreada = datos.oportunidadId;
    await subirImagenSiHay(oportunidadIdCreada);

    const revisión = await fetch(`${API_BASE_URL}/oportunidades/${oportunidadIdCreada}/enviar-revision`, {
        method: 'POST', headers,
    });
    const datosRevision = await revisión.json();
    if (!datosRevision.ok) { mostrarError(datosRevision.mensaje); return; }

    window.location.href = 'mis-oportunidades.html';
});
</script>
</body>
</html>
