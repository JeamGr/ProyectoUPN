<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis oportunidades — Voluntariados UPN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">Mis oportunidades</h3>
    <a href="crear-oportunidad.html" class="btn btn-brand-primary">+ Nueva oportunidad</a>
  </div>

  <div id="alertaError" class="alert alert-danger alert-form"></div>

  <div class="table-responsive bg-white rounded-3 shadow-sm">
    <table class="table align-middle mb-0">
      <thead>
        <tr class="text-muted small text-uppercase">
          <th class="ps-3">Título</th>
          <th>Estado</th>
          <th>Cupos</th>
          <th>Fecha inicio</th>
          <th class="text-end pe-3">Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaOportunidades"></tbody>
    </table>
  </div>
  <p class="text-muted text-center mt-4" id="vacioMensaje" style="display:none;">Aún no has creado ninguna oportunidad.</p>
</div>

<script>
const API_BASE_URL = 'http://localhost:3003';
const token = localStorage.getItem('token');
if (!token) window.location.href = '../public-auth/login.html';

const BADGES = {
    borrador: 'secondary', pendiente_aprobacion: 'warning', publicado: 'success',
    pausado: 'secondary', cerrado: 'dark', cancelado: 'danger', rechazado: 'danger',
};
const ACCIONES = {
    borrador: [{ accion: 'enviar-revision', texto: 'Enviar a revisión' }],
    rechazado: [{ accion: 'enviar-revision', texto: 'Reenviar a revisión' }],
    publicado: [
        { accion: 'pausar', texto: 'Pausar' },
        { accion: 'cerrar', texto: 'Cerrar' },
        { accion: 'gestionar', texto: 'Gestionar' },
    ],
    pausado: [{ accion: 'reanudar', texto: 'Reanudar' }],
};

async function cargar() {
    try {
        const resp = await fetch(`${API_BASE_URL}/oportunidades/me/mias`, {
            headers: { Authorization: `Bearer ${token}` },
        });
        const datos = await resp.json();
        if (!datos.ok) {
            document.getElementById('alertaError').textContent = datos.mensaje;
            document.getElementById('alertaError').style.display = 'block';
            return;
        }

        const tbody = document.getElementById('tablaOportunidades');
        if (datos.oportunidades.length === 0) {
            document.getElementById('vacioMensaje').style.display = 'block';
            return;
        }

        datos.oportunidades.forEach((o) => {
            const acciones = (ACCIONES[o.estado] || [])
                .map((a) => `<button class="btn btn-sm btn-outline-secondary ms-1" onclick="ejecutar(${o.id}, '${a.accion}')">${a.texto}</button>`)
                .join('');

            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td class="ps-3 fw-semibold">${o.titulo}</td>
                <td><span class="badge bg-${BADGES[o.estado] || 'secondary'}">${o.estado.replace('_', ' ')}</span></td>
                <td>${o.cuposDisponibles}/${o.cuposTotales}</td>
                <td>${new Date(o.fechaInicio).toLocaleDateString('es-PE')}</td>
                <td class="text-end pe-3">${acciones}</td>
            `;
            tbody.appendChild(fila);
        });
    } catch (e) {
        document.getElementById('alertaError').textContent = 'No se pudo conectar con el servidor.';
        document.getElementById('alertaError').style.display = 'block';
    }
}

async function ejecutar(id, accion) {
    if (accion === 'gestionar') {
        window.location.href = `gestionar-oportunidad.html?id=${id}`;
        return;
    }
    const resp = await fetch(`${API_BASE_URL}/oportunidades/${id}/${accion}`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    });
    const datos = await resp.json();
    if (!datos.ok) { alert(datos.mensaje); return; }
    window.location.reload();
}

cargar();
</script>
</body>
</html>
