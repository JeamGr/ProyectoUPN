<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YANANTIN - Perfil del Voluntario</title>

  <!-- Bootstrap 5 CSS e Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Sistema de diseño YANANTIN (va ANTES del CSS propio) -->
  <link rel="stylesheet" href="../assets/css/styles.css">

  <!-- CSS Exclusivo del Perfil -->
  <link rel="stylesheet" href="./perfil.css">
</head>
<body>

  <div class="dashboard-container">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand-logo d-flex align-items-center gap-2">
        <i class="bi bi-heart-pulse-fill text-danger"></i> YANANTIN
      </div>

      <nav class="flex-grow-1">
        <a href="../dashboard-voluntario/dashboard-voluntario.html" class="nav-link-custom">
          <i class="bi bi-house-door"></i> Inicio
        </a>
        <a href="../explorar/explorar.html" class="nav-link-custom">
          <i class="bi bi-compass"></i> Explorar
        </a>
        <a href="../mis-eventos/mis-eventos.html" class="nav-link-custom">
          <i class="bi bi-calendar-event"></i> Mis eventos
        </a>
        <a href="#" class="nav-link-custom active">
          <i class="bi bi-person-fill"></i> Mi perfil
        </a>
        <a href="#" class="nav-link-custom">
          <i class="bi bi-gear"></i> Configuración
        </a>
      </nav>

      <div class="border-top pt-3">
        <a href="#" id="btnCerrarSesion" class="nav-link-custom text-danger">
          <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <button class="yn-volver mb-3" onclick="YN.volver('../dashboard-voluntario/dashboard-voluntario.html')">
        <i class="bi bi-arrow-left"></i> Volver
      </button>

      <!-- Tarjeta Principal del Perfil -->
      <div class="card card-profile mb-4">
        <div class="profile-banner"></div>
        
        <div class="p-4 pt-0">
          <div class="d-flex justify-content-between align-items-end mb-3 flex-wrap gap-3">
            <div class="profile-avatar-wrapper">
              <img id="imgAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300" alt="Foto de perfil" class="profile-avatar">
            </div>
            <div>
              <a href="perfil-editar.html" class="btn btn-yanantin-outline">
                <i class="bi bi-pencil-square me-1"></i> Editar perfil
              </a>
            </div>
          </div>

          <div>
            <h3 id="txtNombreCompleto" class="fw-bold mb-1">Cargando...</h3>
            <p class="text-muted mb-2"><span id="txtCarrera">Estudiante</span> • <strong id="txtUniversidad" class="text-dark">Universidad Privada del Norte</strong></p>
            
            <div class="d-flex gap-4 text-muted small flex-wrap">
              <span><i class="bi bi-geo-alt me-1"></i> <span id="txtDistrito">Lima</span></span>
              <span><i class="bi bi-envelope me-1"></i> <span id="txtCorreo">Cargando...</span></span>
              <span><i class="bi bi-telephone me-1"></i> <span id="txtTelefono">--</span></span>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <!-- Columna Izquierda: Sobre mí -->
        <div class="col-lg-7">
          <div class="card card-profile p-4">
            <h5 class="fw-bold mb-3">Sobre mí</h5>
            <p id="txtBiografia" class="text-muted lh-base mb-0">
              Cargando biografía...
            </p>
          </div>
        </div>

        <!-- Columna Derecha: Estadísticas Resumen -->
        <div class="col-lg-5">
          <div class="card card-profile p-4">
            <h5 class="fw-bold mb-3">Resumen de actividad</h5>

            <div class="row g-3 text-center">
              <div class="col-6">
                <div class="metric-box">
                  <h3 id="txtHoras" class="fw-bold mb-0" style="color: #6D28D9;">0</h3>
                  <small class="text-muted">Horas acumuladas</small>
                </div>
              </div>
              <div class="col-6">
                <div class="metric-box">
                  <h3 id="txtOportunidades" class="fw-bold mb-0" style="color: #FF1478;">0</h3>
                  <small class="text-muted">Oportunidades completadas</small>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- SCRIPT CONECTADO A PERFILSERVICE / API -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth-guard.js"
          data-rol="VOLUNTARIO"
          data-login="../public-auth/login-voluntario.html"></script>
  <script>
    // API_BASE_URL vive ahora en config.js; el guardián, en auth-guard.js
    const token = YN.token();

    const headers = { Authorization: `Bearer ${token}` };

    async function cargarPerfil() {
      try {
        // Llama a la ruta que ejecuta PerfilService.obtenerPerfilVoluntario(usuarioId)
        const resp = await fetch(`${API_BASE_URL}/perfiles/voluntario/me`, { headers });
        const datos = await resp.json();

        // Extraer objeto recibido (DTO)
        const perfil = datos.data || datos;

        if (!resp.ok) {
          console.warn('Respuesta de API:', perfil.message);
          return;
        }

        // 1. Pintar datos personales
        const nombres = perfil.nombres || perfil.nombre || '';
        const apellidos = perfil.apellidos || perfil.apellido || '';
        document.getElementById('txtNombreCompleto').textContent = `${nombres} ${apellidos}`.trim() || 'Voluntario YANANTIN';
        
        document.getElementById('txtCarrera').textContent = perfil.carrera || 'Estudiante';
        document.getElementById('txtUniversidad').textContent = perfil.universidad || 'Universidad Privada del Norte';
        document.getElementById('txtDistrito').textContent = perfil.ubicacion || 'Lima';
        document.getElementById('txtCorreo').textContent = perfil.correo || perfil.email || 'Sin correo';
        document.getElementById('txtTelefono').textContent = perfil.telefono || 'Sin teléfono';
        document.getElementById('txtBiografia').textContent = perfil.biografia || perfil.sobreMi || '¡Hola! Soy voluntario universitario en YANANTIN.';

        // 2. Pintar métricas — se piden aparte, el perfil no las trae
        cargarMetricas();

        // 3. Foto de perfil si existe
        // YN.img() antepone API_BASE_URL: foto_url viene como ruta relativa.
        if (perfil.foto_url) {
          document.getElementById('imgAvatar').src = YN.img(perfil.foto_url);
        }

      } catch (error) {
        console.error('Error al cargar datos del perfil:', error);
      }
    }

    async function cargarMetricas() {
      try {
        const respHoras = await fetch(`${API_BASE_URL}/asistencia/mis-horas`, { headers });
        if (respHoras.ok) {
          const datosHoras = await respHoras.json();
          document.getElementById('txtHoras').textContent = datosHoras.horasAcumuladas ?? 0;
        }
      } catch (error) {
        console.error('Error al cargar horas acumuladas:', error);
      }

      try {
        const respEventos = await fetch(`${API_BASE_URL}/inscripciones/mis-eventos`, { headers });
        if (respEventos.ok) {
          const datosEventos = await respEventos.json();
          const lista = Array.isArray(datosEventos) ? datosEventos : (datosEventos.data || []);
          const completadas = lista.filter(i => i.estado === 'completado').length;
          document.getElementById('txtOportunidades').textContent = completadas;
        }
      } catch (error) {
        console.error('Error al cargar oportunidades completadas:', error);
      }
    }

    // Cerrar sesión
    document.getElementById('btnCerrarSesion').addEventListener('click', (e) => {
      e.preventDefault();
      YN.logout('../public-auth/login-voluntario.html');
    });

    // Carga inicial
    cargarPerfil();
  </script>
</body>
</html>
