<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Dashboard — Administrador</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-0">Panel de administrador</h3>
      <p class="text-muted mb-0">Resumen global de la plataforma.</p>
    </div>
    <a href="moderacion.html" class="btn btn-brand-primary">Ir a moderación</a>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="bg-white rounded-3 shadow-sm p-3 text-center">
        <div class="fs-2 fw-bold" style="color: var(--color-primary);" id="mUsuarios">–</div>
        <div class="text-muted small">Usuarios activos</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="bg-white rounded-3 shadow-sm p-3 text-center">
        <div class="fs-2 fw-bold" style="color: var(--color-secondary);" id="mOrganizaciones">–</div>
        <div class="text-muted small">Organizaciones</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="bg-white rounded-3 shadow-sm p-3 text-center">
        <div class="fs-2 fw-bold" style="color: var(--color-accent);" id="mOportunidades">–</div>
        <div class="text-muted small">Oportunidades</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="bg-white rounded-3 shadow-sm p-3 text-center">
        <div class="fs-2 fw-bold" style="color: var(--color-dark);" id="mHoras">–</div>
        <div class="text-muted small">Horas totales</div>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-3 shadow-sm p-3">
    <h5 class="fw-bold mb-3">Usuarios nuevos — últimos 7 días</h5>
    <table class="table table-sm">
      <thead class="text-muted small text-uppercase"><tr><th>Día</th><th>Registros</th></tr></thead>
      <tbody id="tablaUsuariosNuevos"></tbody>
    </table>
  </div>
</div>

<script>
const API_BASE_URL = 'http://localhost:3003';
const token = localStorage.getItem('token');
if (!token) window.location.href = '../public-auth/login.html';
const headers = { Authorization: `Bearer ${token}` };

async function cargar() {
    const resp = await fetch(`${API_BASE_URL}/administrador/metricas`, { headers });
    const datos = await resp.json();
    if (!datos.ok) return;

    document.getElementById('mUsuarios').textContent = datos.usuariosActivos;
    document.getElementById('mOrganizaciones').textContent = datos.organizacionesActivas;
    document.getElementById('mOportunidades').textContent = datos.oportunidadesTotales;
    document.getElementById('mHoras').textContent = datos.horasTotales;

    const tbody = document.getElementById('tablaUsuariosNuevos');
    (datos.usuariosNuevosUltimos7Dias || []).forEach((fila) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${new Date(fila.dia).toLocaleDateString('es-PE')}</td><td>${fila.total}</td>`;
        tbody.appendChild(tr);
    });
}
cargar();
</script>
</body>
</html>
